<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LTM Graph</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <style>
    :root {
      --bg: #1a1a2e; --surface: #16213e; --surface2: #0f3460;
      --text: #e2e8f0; --text-muted: #94a3b8; --border: #2d3748; --accent: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", monospace; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    header { display: flex; align-items: center; gap: 8px; padding: 7px 12px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; flex-wrap: wrap; }
    header h1 { font-size: 14px; font-weight: 600; white-space: nowrap; }
    #search { background: var(--bg); border: 1px solid var(--border); border-radius: 5px; padding: 4px 9px; color: var(--text); font-size: 12px; width: 160px; }
    #search:focus { outline: none; border-color: var(--accent); }
    .filters { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
    .filter-btn { border: none; border-radius: 4px; padding: 2px 7px; font-size: 10px; font-weight: 700; cursor: pointer; opacity: 0.35; transition: opacity 0.12s; }
    .filter-btn.active { opacity: 1; }
    #stats { margin-left: auto; font-size: 10px; color: var(--text-muted); white-space: nowrap; }
    #ws-dot { width: 7px; height: 7px; border-radius: 50%; background: #f87171; flex-shrink: 0; }
    #ws-dot.on { background: #4ade80; }
    #add-btn { background: var(--accent); color: #000; border: none; border-radius: 4px; padding: 3px 10px; font-size: 11px; font-weight: 700; cursor: pointer; }
    #add-modal { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; }
    #add-modal.open { display: flex; }
    #add-form { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; width: 340px; max-width: 90vw; }
    #add-form h2 { font-size: 14px; margin-bottom: 10px; }
    #add-form label { font-size: 11px; color: var(--text-muted); display: block; margin-top: 8px; }
    #add-form textarea, #add-form select, #add-form input[type=text] { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 6px 8px; color: var(--text); font-size: 12px; font-family: inherit; margin-top: 3px; }
    #add-form textarea { height: 70px; resize: vertical; }
    #add-form .form-row { display: flex; gap: 8px; }
    #add-form .form-row > * { flex: 1; }
    #add-form button[type=submit] { margin-top: 12px; background: var(--accent); color: #000; border: none; border-radius: 4px; padding: 6px 16px; font-size: 12px; font-weight: 700; cursor: pointer; width: 100%; }
    #add-form .cancel { margin-top: 6px; background: none; color: var(--text-muted); border: none; font-size: 11px; cursor: pointer; width: 100%; text-align: center; display: block; }
    main { display: flex; flex: 1; overflow: hidden; }

    /* Left projects panel */
    #projects-panel { width: 175px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; overflow-y: auto; }
    #projects-panel h2 { font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); padding: 10px 12px 5px; letter-spacing: .06em; }
    .proj-item { padding: 7px 10px 7px 12px; font-size: 12px; cursor: pointer; border-left: 3px solid transparent; border-bottom: 1px solid var(--border); transition: background 0.1s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; justify-content: space-between; align-items: center; }
    .proj-item:hover { background: var(--surface2); }
    .proj-item.active { border-left-color: var(--accent); background: var(--surface2); color: var(--accent); }
    .proj-count { font-size: 10px; color: var(--text-muted); margin-left: 4px; flex-shrink: 0; }
    #proj-all { color: var(--text-muted); font-weight: 600; }

    /* Context legend */
    #ctx-legend { padding: 8px 10px; border-top: 1px solid var(--border); margin-top: auto; }
    #ctx-legend h3 { font-size: 9px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin-bottom: 5px; letter-spacing: .05em; }
    .legend-row { display: flex; align-items: center; gap: 5px; margin-bottom: 3px; font-size: 10px; color: var(--text-muted); }
    .legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    #graph-container { flex: 1; position: relative; overflow: hidden; }
    svg { width: 100%; height: 100%; }
    .link { stroke-opacity: 0.4; stroke-width: 1.5; }
    .link.project_scope { stroke-opacity: 0.2; stroke-dasharray: 4 3; }
    .link.context_of { stroke-opacity: 0.15; stroke-dasharray: 2 4; }
    .node circle { stroke: rgba(255,255,255,0.1); stroke-width: 1; cursor: pointer; }
    .node.project-node circle { stroke: rgba(255,255,255,0.5); stroke-width: 2; }
    .node.ctx-node circle { stroke: rgba(255,255,255,0.05); }
    .node.selected circle { stroke: white; stroke-width: 2.5; }
    .node text { font-size: 8.5px; fill: var(--text-muted); pointer-events: none; text-anchor: middle; }
    .node.project-node text { font-size: 10px; fill: var(--text); font-weight: 600; }
    .node.ctx-node text { font-size: 8px; fill: #64748b; }
    .tooltip { position: absolute; background: rgba(0,0,0,0.9); color: var(--text); padding: 5px 10px; border-radius: 5px; font-size: 11px; pointer-events: none; z-index: 10; max-width: 250px; line-height: 1.5; display: none; white-space: pre-wrap; }

    /* Right sidebar */
    #sidebar { width: 295px; background: var(--surface); border-left: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; overflow-y: auto; }
    #sb-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-muted); font-size: 12px; padding: 20px; text-align: center; gap: 6px; }
    #sb-body { padding: 13px; display: none; }
    .lbl { font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); letter-spacing: .05em; margin-bottom: 3px; }
    .val { font-size: 12px; line-height: 1.5; margin-bottom: 10px; word-break: break-word; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 11px; font-weight: 700; color: #000; margin-bottom: 10px; }
    .tag { display: inline-block; background: var(--surface2); color: var(--text); padding: 2px 6px; border-radius: 3px; font-size: 10px; margin: 2px; }
    .rel-item { background: var(--bg); border-radius: 5px; padding: 6px 8px; margin-bottom: 5px; font-size: 11px; cursor: pointer; border: 1px solid var(--border); }
    .rel-item:hover { border-color: var(--accent); }
    .rel-type { color: var(--text-muted); font-size: 10px; margin-bottom: 2px; }
    .stars { color: #facc15; }
    .ctx-tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 9px; }
    .ctx-tab { padding: 5px 9px; font-size: 11px; cursor: pointer; color: var(--text-muted); border-bottom: 2px solid transparent; transition: all 0.1s; white-space: nowrap; }
    .ctx-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .ctx-item { font-size: 11px; line-height: 1.5; padding: 5px 0; border-bottom: 1px solid var(--border); color: var(--text-muted); }
    .ctx-item:last-child { border-bottom: none; }
    #imp-wrap { display: flex; align-items: center; gap: 6px; }
    #imp-wrap label { font-size: 10px; color: var(--text-muted); white-space: nowrap; }
    #imp-wrap input { width: 65px; }
  </style>
</head>
<body>
<header>
  <div id="ws-dot" title="WebSocket"></div>
  <h1>&#129504; LTM Graph</h1>
  <input id="search" type="text" placeholder="Search&hellip;" />
  <div class="filters" id="cat-filters">
    <span style="font-size:10px;color:var(--text-muted)">Filter:</span>
  </div>
  <div id="imp-wrap">
    <label>&#9733; min: <span id="imp-val">1</span></label>
    <input type="range" id="imp-slider" min="1" max="5" value="1" />
  </div>
  <button id="add-btn" onclick="document.getElementById('add-modal').classList.add('open')">+ Add</button>
  <div id="stats"></div>
</header>
<div id="add-modal">
  <form id="add-form" onsubmit="return submitMemory(event)">
    <h2>Add Memory</h2>
    <label>Content</label>
    <textarea id="m-content" placeholder="What did you learn?" required></textarea>
    <div class="form-row">
      <div><label>Category</label>
        <select id="m-cat"><option>pattern</option><option>preference</option><option>architecture</option><option>gotcha</option><option>workflow</option><option>constraint</option></select>
      </div>
      <div><label>Importance (1-5)</label>
        <select id="m-imp"><option>3</option><option>1</option><option>2</option><option>4</option><option>5</option></select>
      </div>
    </div>
    <label>Project scope (optional)</label>
    <input type="text" id="m-proj" placeholder="Leave empty for global" />
    <label>Tags (comma separated)</label>
    <input type="text" id="m-tags" placeholder="e.g. bun, sqlite" />
    <button type="submit">Save</button>
    <button type="button" class="cancel" onclick="document.getElementById('add-modal').classList.remove('open')">Cancel</button>
  </form>
</div>
<main>
  <!-- Projects panel -->
  <div id="projects-panel">
    <h2>Projects</h2>
    <div class="proj-item active" id="proj-all" data-proj=""><span>All</span></div>
    <!-- Context legend at bottom -->
    <div id="ctx-legend">
      <h3>Context types</h3>
      <div class="legend-row"><div class="legend-dot" style="background:#fbbf24"></div>goal</div>
      <div class="legend-row"><div class="legend-dot" style="background:#fb923c"></div>decision</div>
      <div class="legend-row"><div class="legend-dot" style="background:#f87171"></div>gotcha</div>
      <div class="legend-row"><div class="legend-dot" style="background:#60a5fa"></div>progress</div>
      <div class="legend-row"><div class="legend-dot" style="background:#38bdf8"></div>project</div>
    </div>
  </div>

  <div id="graph-container">
    <svg id="graph"></svg>
    <div class="tooltip" id="tip"></div>
  </div>

  <div id="sidebar">
    <div id="sb-empty">
      <span>Click a node to inspect</span>
      <small>or click a project for its context</small>
    </div>
    <div id="sb-body"></div>
  </div>
</main>
<script>
// Memory category colors
const MEM_COLORS = {
  preference:"#4ade80", architecture:"#60a5fa", gotcha_mem:"#f87171",
  pattern:"#a78bfa", workflow:"#fb923c", constraint:"#facc15",
};
// Context item type colors
const CTX_COLORS = {
  goal:"#fbbf24", decision:"#fb923c", gotcha:"#f87171", progress:"#60a5fa",
};
const PROJ_COLOR = "#38bdf8";
const LCOLORS = {
  supports:"#4ade80", contradicts:"#f87171", refines:"#60a5fa",
  depends_on:"#fb923c", related_to:"#94a3b8", supersedes:"#a78bfa",
  project_scope:"#38bdf8", context_of:"#475569",
};
const DEFAULT_COLOR = "#7c83a0";
const TYPE_ICONS = { goal:"🎯", decision:"⚙️", gotcha:"⚠️", progress:"✓" };

function nodeColor(d) {
  if (d.category === "project") return PROJ_COLOR;
  if (d.is_context) return CTX_COLORS[d.category] || DEFAULT_COLOR;
  return MEM_COLORS[d.category] || DEFAULT_COLOR;
}
function nodeR(d) {
  if (d.category === "project") return 20;
  if (d.is_context) return 5;
  return 7 + (d.importance - 1) * 3.5;
}

let allNodes=[], allLinks=[], activeCats=new Set([...Object.keys(MEM_COLORS),'project',...Object.keys(CTX_COLORS)]);
let minImp=1, query="", selNode=null, activeProj="";
let nodeSel, linkSel, sim;

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function stars(n){ return "&#9733;".repeat(n)+"&#9734;".repeat(5-n); }

/* ---- WS ---- */
let ws;
function connectWS(){
  const proto=location.protocol==="https:"?"wss:":"ws:";
  ws=new WebSocket(`${proto}//${location.host}/ws`);
  ws.onopen=()=>document.getElementById("ws-dot").classList.add("on");
  ws.onclose=()=>{ document.getElementById("ws-dot").classList.remove("on"); setTimeout(connectWS,2000); };
  ws.onmessage=(e)=>{ const m=JSON.parse(e.data); if(m.type==="refresh") loadData(); };
}

/* ---- Data ---- */
async function loadData(){
  const [g,s]=await Promise.all([
    fetch("/api/graph").then(r=>r.json()),
    fetch("/api/stats").then(r=>r.json()),
  ]);
  allNodes=g.nodes; allLinks=g.links;
  document.getElementById("stats").textContent=
    `${s.memories} memories · ${s.relations} rels · ${s.projects} projects`;
  buildFilters();
  buildProjectList();
  renderGraph();
}

/* ---- Category filters ---- */
function buildFilters(){
  const el=document.getElementById("cat-filters");
  const existing=new Set([...el.querySelectorAll(".filter-btn")].map(b=>b.dataset.cat));
  // Only show memory categories + project in the filter (context types visible when focused)
  const memCats=[...new Set(allNodes.filter(n=>!n.is_context&&n.category!=="project").map(n=>n.category))];
  memCats.forEach(cat=>{
    if(existing.has(cat)) return;
    const btn=document.createElement("button");
    btn.className="filter-btn active"; btn.dataset.cat=cat; btn.textContent=cat;
    btn.style.background=nodeColor({category:cat}); btn.style.color="#000";
    btn.onclick=()=>{ activeCats.has(cat)?activeCats.delete(cat):activeCats.add(cat); btn.classList.toggle("active",activeCats.has(cat)); renderGraph(); };
    el.appendChild(btn);
  });
}

/* ---- Projects panel ---- */
function buildProjectList(){
  const panel=document.getElementById("projects-panel");
  [...panel.querySelectorAll(".proj-item:not(#proj-all)")].forEach(el=>el.remove());
  const legend=document.getElementById("ctx-legend");
  const projects=allNodes.filter(n=>n.category==="project").sort((a,b)=>a.label.localeCompare(b.label));
  projects.forEach(p=>{
    const item=document.createElement("div"); item.className="proj-item"; item.dataset.proj=p.label;
    item.title=p.label;
    const name=document.createElement("span"); name.textContent=p.label; name.style.overflow="hidden"; name.style.textOverflow="ellipsis";
    const cnt=document.createElement("span"); cnt.className="proj-count"; cnt.textContent=p.confirm_count;
    item.appendChild(name); item.appendChild(cnt);
    item.onclick=()=>focusProject(p.label, item);
    panel.insertBefore(item, legend);
  });
}

function focusProject(name, itemEl){
  if(activeProj===name){
    activeProj="";
    document.querySelectorAll(".proj-item").forEach(el=>el.classList.remove("active"));
    document.getElementById("proj-all").classList.add("active");
    deselect(); renderGraph(); return;
  }
  activeProj=name;
  document.querySelectorAll(".proj-item").forEach(el=>el.classList.remove("active"));
  itemEl.classList.add("active");
  const pNode=allNodes.find(n=>n.category==="project"&&n.label===name);
  if(pNode) selectNode(pNode);
  renderGraph();
}

document.getElementById("proj-all").onclick=()=>{
  activeProj="";
  document.querySelectorAll(".proj-item").forEach(el=>el.classList.remove("active"));
  document.getElementById("proj-all").classList.add("active");
  deselect(); renderGraph();
};

/* ---- Visibility logic ---- */
function visibleNodes(){
  return allNodes.filter(n=>{
    // Context nodes: only show when a project is focused
    if(n.is_context){
      if(!activeProj) return false;
      return n.project_scope===activeProj;
    }
    if(!activeCats.has(n.category)) return false;
    if(n.category!=="project" && !n.is_context && n.importance<minImp) return false;
    if(query && !n.content.toLowerCase().includes(query)) return false;
    if(activeProj && n.category==="project") return n.label===activeProj;
    if(activeProj && n.category!=="project"){
      // show global memories + scoped to this project
      return n.project_scope===null||n.project_scope===activeProj;
    }
    return true;
  });
}

/* ---- Graph ---- */
function renderGraph(){
  const cont=document.getElementById("graph-container"), W=cont.clientWidth, H=cont.clientHeight;
  const svgEl=document.getElementById("graph"); svgEl.innerHTML="";
  const vis=visibleNodes();
  const visIds=new Set(vis.map(n=>n.id));
  const visLinks=allLinks.filter(l=>{ const s=l.source?.id??l.source, t=l.target?.id??l.target; return visIds.has(s)&&visIds.has(t); });
  const nd=vis.map(n=>({...n}));
  const ld=visLinks.map(l=>({ source:l.source?.id??l.source, target:l.target?.id??l.target, type:l.type }));

  const svg=d3.select(svgEl);
  const defs=svg.append("defs");
  Object.entries(LCOLORS).forEach(([t,c])=>{
    if(t==="context_of") return; // no arrowhead for context edges
    defs.append("marker").attr("id","arr-"+t).attr("viewBox","0 -4 8 8").attr("refX",30).attr("refY",0).attr("markerWidth",4).attr("markerHeight",4).attr("orient","auto")
      .append("path").attr("d","M0,-4L8,0L0,4").attr("fill",c);
  });

  const g=svg.append("g");
  svg.call(d3.zoom().scaleExtent([0.04,6]).on("zoom",e=>g.attr("transform",e.transform)));

  const linkDistance = d => {
    if(d.type==="context_of") return 60;
    if(d.type==="project_scope") return 130;
    return 80;
  };
  const chargeStr = d => {
    if(d.category==="project") return -800;
    if(d.is_context) return -60;
    return -200;
  };

  sim=d3.forceSimulation(nd)
    .force("link",d3.forceLink(ld).id(d=>d.id).distance(linkDistance))
    .force("charge",d3.forceManyBody().strength(chargeStr))
    .force("center",d3.forceCenter(W/2,H/2))
    .force("collision",d3.forceCollide().radius(d=>nodeR(d)+4));

  linkSel=g.append("g").selectAll("line").data(ld).enter().append("line")
    .attr("class",d=>"link "+d.type)
    .attr("stroke",d=>LCOLORS[d.type]||DEFAULT_COLOR)
    .attr("marker-end",d=>(d.type!=="project_scope"&&d.type!=="context_of")?"url(#arr-"+d.type+")":"");

  nodeSel=g.append("g").selectAll("g").data(nd).enter().append("g")
    .attr("class",d=>"node"+(d.category==="project"?" project-node":d.is_context?" ctx-node":""))
    .call(d3.drag()
      .on("start",(e,d)=>{ if(!e.active) sim.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; })
      .on("drag",(e,d)=>{ d.fx=e.x; d.fy=e.y; })
      .on("end",(e,d)=>{ if(!e.active) sim.alphaTarget(0); d.fx=null; d.fy=null; }))
    .on("click",(e,d)=>{ e.stopPropagation(); selectNode(d); })
    .on("mouseover",(e,d)=>{
      const t=document.getElementById("tip"); t.style.display="block";
      t.style.left=(e.offsetX+14)+"px"; t.style.top=(e.offsetY-10)+"px";
      t.textContent=(d.is_context?`[${d.category}] `:"")+d.content;
    })
    .on("mouseout",()=>{ document.getElementById("tip").style.display="none"; });

  nodeSel.append("circle").attr("r",d=>nodeR(d)).attr("fill",d=>nodeColor(d));
  nodeSel.append("text").attr("dy",d=>nodeR(d)+9).text(d=>{
    const l=d.category==="project"?d.label:(d.label||d.content);
    const max=d.category==="project"?18:d.is_context?16:19;
    return l.length>max?l.substring(0,max)+"…":l;
  });

  svg.on("click",()=>{ if(!activeProj) deselect(); });

  sim.on("tick",()=>{
    linkSel.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y).attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
    nodeSel.attr("transform",d=>`translate(${d.x},${d.y})`);
  });

  if(selNode){ const s=nd.find(n=>n.id===selNode.id); if(s) selectNode(s,true); }
}

/* ---- Sidebar: Memory node ---- */
function showMemorySidebar(d){
  const sb=document.getElementById("sb-body"); sb.innerHTML="";
  const nodeMap=new Map(allNodes.map(n=>[n.id,n]));
  const rels=allLinks.filter(l=>{ const s=l.source?.id??l.source, t=l.target?.id??l.target;
    return (s===d.id||t===d.id)&&l.type!=="project_scope"&&l.type!=="context_of";
  }).map(l=>{ const s=l.source?.id??l.source, t=l.target?.id??l.target;
    const oid=s===d.id?t:s; return { node:nodeMap.get(oid), type:l.type, dir:s===d.id?"→":"←" };
  }).filter(r=>r.node&&!r.node.is_context&&r.node.category!=="project");

  function row(label, html){ const ld=document.createElement("div"); ld.className="lbl"; ld.textContent=label; const vd=document.createElement("div"); vd.className="val"; vd.innerHTML=html; sb.appendChild(ld); sb.appendChild(vd); }
  const badge=document.createElement("span"); badge.className="badge"; badge.style.background=nodeColor(d); badge.textContent=d.category;
  const lc=document.createElement("div"); lc.className="lbl"; lc.textContent="Category"; sb.appendChild(lc); sb.appendChild(badge);
  row("Importance",`<span class="stars">${stars(d.importance)}</span>`);
  if(d.project_scope) row("Project",esc(d.project_scope));
  row("Content",esc(d.content));
  if(d.tags&&d.tags.length) row("Tags",d.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join(""));
  row("Confidence / Confirmed",`${(d.confidence*100).toFixed(0)}% &middot; ${d.confirm_count}&times;`);
  if(d.created_at) row("Created",esc(d.created_at));
  if(rels.length){
    const rl=document.createElement("div"); rl.className="lbl"; rl.textContent=`Relations (${rels.length})`; sb.appendChild(rl);
    rels.forEach(r=>{ const item=document.createElement("div"); item.className="rel-item"; const rt=document.createElement("div"); rt.className="rel-type"; rt.textContent=`${r.dir} ${r.type}`; const rc=document.createElement("div"); rc.textContent=(r.node.label||r.node.content).substring(0,55); item.appendChild(rt); item.appendChild(rc); item.addEventListener("click",()=>selectNode(r.node)); sb.appendChild(item); });
  }
}

/* ---- Sidebar: Context item node ---- */
function showContextSidebar(d){
  const sb=document.getElementById("sb-body"); sb.innerHTML="";
  const badge=document.createElement("span"); badge.className="badge"; badge.style.background=CTX_COLORS[d.category]||DEFAULT_COLOR;
  badge.textContent=`${TYPE_ICONS[d.category]||""} ${d.category}`;
  const lc=document.createElement("div"); lc.className="lbl"; lc.textContent="Type"; sb.appendChild(lc); sb.appendChild(badge);
  const lp=document.createElement("div"); lp.className="lbl"; lp.textContent="Project";
  const vp=document.createElement("div"); vp.className="val"; vp.textContent=d.project_scope||""; sb.appendChild(lp); sb.appendChild(vp);
  const lct=document.createElement("div"); lct.className="lbl"; lct.textContent="Content";
  const vc=document.createElement("div"); vc.className="val"; vc.textContent=d.content; sb.appendChild(lct); sb.appendChild(vc);
  if(d.created_at){ const la=document.createElement("div"); la.className="lbl"; la.textContent="Created"; const va=document.createElement("div"); va.className="val"; va.textContent=d.created_at; sb.appendChild(la); sb.appendChild(va); }
}

/* ---- Sidebar: Project node ---- */
let activeCtxTab="goal";
async function showProjectSidebar(d){
  const sb=document.getElementById("sb-body"); sb.innerHTML="";
  const title=document.createElement("div"); title.style.cssText="font-size:14px;font-weight:700;margin-bottom:3px;"; title.textContent="🏗 "+d.label; sb.appendChild(title);
  const sub=document.createElement("div"); sub.style.cssText="font-size:10px;color:var(--text-muted);margin-bottom:11px;"; sub.textContent=`${d.confirm_count} context items`; sb.appendChild(sub);

  const ctx=await fetch(`/api/context/${encodeURIComponent(d.label)}`).then(r=>r.json());
  const tabTypes=["goal","decision","gotcha","progress"];
  const tabs=document.createElement("div"); tabs.className="ctx-tabs";
  tabTypes.forEach(type=>{ const count=(ctx[type]||[]).length; if(!count) return;
    const tab=document.createElement("div"); tab.className="ctx-tab"+(activeCtxTab===type?" active":"");
    tab.dataset.type=type; tab.innerHTML=`${TYPE_ICONS[type]} ${type} <small>(${count})</small>`;
    tab.onclick=()=>{ activeCtxTab=type; renderCtx(ctx); tabs.querySelectorAll(".ctx-tab").forEach(t=>t.classList.toggle("active",t.dataset.type===type)); };
    tabs.appendChild(tab);
  });
  sb.appendChild(tabs);
  if(!(ctx[activeCtxTab]||[]).length) activeCtxTab=tabTypes.find(t=>(ctx[t]||[]).length)||"goal";
  tabs.querySelectorAll(".ctx-tab").forEach(t=>t.classList.toggle("active",t.dataset.type===activeCtxTab));

  const itemsEl=document.createElement("div"); itemsEl.id="ctx-items"; sb.appendChild(itemsEl);
  function renderCtx(c){ itemsEl.innerHTML=""; (c[activeCtxTab]||[]).forEach(content=>{ const item=document.createElement("div"); item.className="ctx-item"; item.textContent=content; itemsEl.appendChild(item); }); if(!(c[activeCtxTab]||[]).length) itemsEl.textContent="No items"; }
  renderCtx(ctx);

  const scoped=allNodes.filter(n=>!n.is_context&&n.project_scope===d.label);
  if(scoped.length){
    const ml=document.createElement("div"); ml.className="lbl"; ml.style.marginTop="12px"; ml.textContent=`Memories (${scoped.length})`; sb.appendChild(ml);
    scoped.forEach(m=>{ const item=document.createElement("div"); item.className="rel-item"; const rt=document.createElement("div"); rt.className="rel-type"; rt.textContent=m.category; const rc=document.createElement("div"); rc.textContent=(m.label||m.content).substring(0,58); item.appendChild(rt); item.appendChild(rc); item.addEventListener("click",()=>selectNode(m)); sb.appendChild(item); });
  }
}

/* ---- Select ---- */
function selectNode(d, silent=false){
  selNode=d; nodeSel?.classed("selected",n=>n.id===d.id);
  document.getElementById("sb-empty").style.display="none";
  const sb=document.getElementById("sb-body"); sb.style.display="block";
  if(d.category==="project"){
    if(!silent) document.querySelectorAll(".proj-item").forEach(el=>el.classList.toggle("active",el.dataset.proj===d.label));
    showProjectSidebar(d);
  } else if(d.is_context){
    showContextSidebar(d);
  } else {
    showMemorySidebar(d);
  }
}

function deselect(){
  selNode=null; nodeSel?.classed("selected",false);
  document.getElementById("sb-empty").style.display="flex";
  document.getElementById("sb-body").style.display="none";
}

document.getElementById("search").addEventListener("input",e=>{ query=e.target.value.trim().toLowerCase(); renderGraph(); });
document.getElementById("imp-slider").addEventListener("input",e=>{ minImp=Number(e.target.value); document.getElementById("imp-val").textContent=minImp; renderGraph(); });

async function submitMemory(e){
  e.preventDefault();
  const tags=document.getElementById("m-tags").value.split(",").map(t=>t.trim()).filter(Boolean);
  const proj=document.getElementById("m-proj").value.trim()||null;
  const res=await fetch("/api/memory/learn",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
    content:document.getElementById("m-content").value,
    category:document.getElementById("m-cat").value,
    importance:Number(document.getElementById("m-imp").value),
    project_scope:proj,
    tags,
  })});
  const j=await res.json();
  if(j.ok){ document.getElementById("add-modal").classList.remove("open"); document.getElementById("add-form").reset(); loadData(); }
  else alert("Error: "+(j.error||"unknown"));
  return false;
}

connectWS();
loadData();
</script>
</body>
</html>
